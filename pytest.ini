[pytest]
# Raiz dos fontes: permite que os testes importem os módulos (agua, terreno,
# validacao, visualizacao, principal) sem depender do diretório de execução.
pythonpath = src

# Onde procurar os testes. Permite rodar tudo de uma vez (`pytest`) ou por
# módulo (`pytest src/agua`, `pytest src/terreno`, etc.).
testpaths = src

# Convenção única de nomenclatura dos testes (padrão pytest).
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra -q
